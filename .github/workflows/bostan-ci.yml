# Bostan private CI. The only workflow allowed in this repository.
# scripts/bostan-workflow-quarantine-gate.mjs rejects schedules,
# pull_request_target, write scopes, secrets, upstream references, publish
# steps and unpinned actions in any workflow, including this one.
name: Bostan CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bostan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node scripts/bostan-workflow-quarantine-gate.mjs
      - run: node --test scripts/bostan-workflow-quarantine-gate.test.mjs
      - run: node scripts/bostan-private-preflight.mjs
      - run: >-
          node --test scripts/bostan-private-workflow-admission.test.mjs
          scripts/bostan-private-preflight.test.mjs
          scripts/bostan-private-docs-entry-gate.test.mjs
          scripts/bostan-private-ui-brand-gate.test.mjs

  # Full-history secret scan with a pinned, checksum-verified gitleaks.
  # Reviewed non-secret findings live in .gitleaksignore; any new finding fails.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (sha256-pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - run: >-
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact --no-banner
          --gitleaks-ignore-path .gitleaksignore

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --workspace-concurrency=1 typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # node:test suites under server/scripts (excluded from server vitest).
      - run: node --test $(grep -lE "from ['\"]node:test['\"]" scripts/*.test.mjs)
        working-directory: server
      - run: node --test scripts/*.test.mjs
        working-directory: ui
      - run: node --test packages/db/scripts/copy-runtime-assets.test.mjs
      # bostan-local-install exercises the compiled preview CLI in cli/dist.
      - run: node scripts/build-bostan-preview.mjs
        working-directory: cli
      - run: node --test $(grep -lE "from ['\"]node:test['\"]" src/__tests__/*.test.mjs)
        working-directory: cli
      - run: >-
          node --test packages/adapters/codex-local/scripts/copy-build-assets.test.mjs
          packages/adapters/grok-local/scripts/copy-build-assets.test.mjs

  # Builds the component library: catches Storybook/Vite dependency breakage
  # that the unit lanes do not exercise.
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bostan/ui build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"

  # The full suite is several hours of vitest time; one 2-core runner cannot
  # finish it. Groups and shards are the ones scripts/run-vitest-stable.mjs
  # already defines.
  test:
    name: test (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: server-1, args: "--mode general --group general-server-without-chat --shard-index 0 --shard-count 4" }
          - { lane: server-2, args: "--mode general --group general-server-without-chat --shard-index 1 --shard-count 4" }
          - { lane: server-3, args: "--mode general --group general-server-without-chat --shard-index 2 --shard-count 4" }
          - { lane: server-4, args: "--mode general --group general-server-without-chat --shard-index 3 --shard-count 4" }
          - { lane: chat, args: "--mode general --group general-chat" }
          - { lane: workspaces-a, args: "--mode general --group general-workspaces-a" }
          - { lane: workspaces-b, args: "--mode general --group general-workspaces-b" }
          - { lane: workspaces-c, args: "--mode general --group general-workspaces-c" }
          - { lane: serialized-1, args: "--mode serialized --shard-index 0 --shard-count 2" }
          - { lane: serialized-2, args: "--mode serialized --shard-index 1 --shard-count 2" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run preflight:workspace-links
      - run: pnpm --filter @bostan/plugin-sdk ensure-build-deps
      # Server suites (dot-runner, native-codex-runner) build the Rust runner
      # with a 5-minute bound; a cold release build exceeds it on 2-core
      # runners. Build (cached) up front so their freshness check is quick.
      - if: startsWith(matrix.lane, 'server-')
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: packages/bostan-runner/runner
          cache-on-failure: true
      # Mirror each suite's exact cargo invocation: feature unification differs
      # between the single-bin (dot-runner) and two-bin (native-codex-runner)
      # builds, so building only one leaves the other cold.
      # Run from packages/bostan-runner like the suites do: rustup selects the
      # pinned toolchain from its rust-toolchain.toml by working directory, and
      # a build under the runner's default toolchain is not reusable.
      - if: startsWith(matrix.lane, 'server-')
        working-directory: packages/bostan-runner
        run: |
          cargo build --release --locked --manifest-path runner/Cargo.toml -p paperclip-runner-core --bin paperclip-runnerd
          cargo build --release --locked --manifest-path runner/Cargo.toml -p paperclip-runner-core --bin paperclip-runnerd --bin fake-codex-app-server
      - run: node scripts/run-vitest-stable.mjs ${{ matrix.args }}

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Runner qualification hashes canonical source bytes. Disable CRLF
      # conversion before checkout so generated manifests remain reproducible.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/link-plugin-dev-sdk.test.js
      - run: node --test packages/db/scripts/copy-runtime-assets.test.mjs
      # An install/typecheck does not exercise emitted JS or runtime assets.
      # Build serially and drive the real authenticated server under plain Node.
      - run: pnpm --filter @bostan/server... --workspace-concurrency=1 build
      - run: node --test scripts/bostan-server-journey-command.test.mjs
      - run: node --test scripts/bostan-ci-windows-user.test.mjs
      - run: ./scripts/bostan-ci-windows-user.ps1 -Mode Server

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: node -p "process.platform + '-' + process.arch"
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix desktop ci
      # npm may withhold dependency lifecycle scripts. Fetch Electron's pinned
      # platform runtime explicitly before native host tests and packaging.
      - run: node desktop/node_modules/electron/install.js
      - run: npm --prefix desktop test
      - run: npm --prefix desktop run test:host
      - run: pnpm --filter @bostan/server... --workspace-concurrency=1 build
      - run: pnpm --filter @bostan/ui build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm --prefix desktop run package
      - if: runner.os == 'Windows'
        run: ./scripts/bostan-ci-windows-user.ps1 -Mode Installer
      - if: runner.os == 'macOS'
        run: node desktop/scripts/qualify-macos-installer.mjs
        env:
          BOSTAN_DESKTOP_INSTALLER_QA: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bostan-unsigned-qualification-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/SHA256SUMS
            desktop/dist/bostan-sbom.cdx.json
            desktop/dist/bostan-license-inventory.json
