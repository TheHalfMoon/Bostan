name: Bostan Windows Native Agent Qualification

on:
  push:
    branches: [fix/windows-packaged-server-import]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bostan-native-windows-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-agent:
    if: github.repository == 'TheHalfMoon/Bostan'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Measure hosted Windows resources before build
        run: node -e "const os=require('node:os'),fs=require('node:fs');const d=fs.statfsSync(os.tmpdir());console.log(JSON.stringify({platform:process.platform,architecture:process.arch,totalMemoryGiB:+(os.totalmem()/2**30).toFixed(2),freeMemoryGiB:+(os.freemem()/2**30).toFixed(2),tempFreeGiB:+(d.bavail*d.bsize/2**30).toFixed(2)}))"
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix desktop ci
      - run: node desktop/node_modules/electron/install.js
      - run: pnpm --filter @bostan/server... --workspace-concurrency=1 build
      - name: Probe embedded PostgreSQL before packaging or model setup
        shell: pwsh
        run: |
          try {
            $windowsOs = Get-CimInstance Win32_OperatingSystem
            $memory = [ordered]@{
              freePhysicalMemoryGiB = [math]::Round(([double]$windowsOs.FreePhysicalMemory / 1MB), 2)
              freeVirtualMemoryGiB = [math]::Round(([double]$windowsOs.FreeVirtualMemory / 1MB), 2)
              totalVirtualMemoryGiB = [math]::Round(([double]$windowsOs.TotalVirtualMemorySize / 1MB), 2)
            }
            Write-Host "BOSTAN_POSTGRES_HOST_MEMORY $($memory | ConvertTo-Json -Compress)"
          } catch {
            Write-Host "BOSTAN_POSTGRES_HOST_MEMORY unavailable"
          }
          node scripts/bostan-windows-embedded-postgres-node-probe.mjs
          $probeExitCode = $LASTEXITCODE
          Write-Host "BOSTAN_NODE_POSTGRES_PROBE_SHELL_EXIT $probeExitCode"
          if ($probeExitCode -ne 0) {
            try {
              $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-30) } -MaxEvents 50 -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -in @('Application Error', 'Windows Error Reporting') -and $_.Message -match '(?i)postgres\.exe' } | Select-Object -First 3)
              foreach ($event in $events) {
                $faultingModule = $null
                $exceptionCode = $null
                if ($event.Message -match '(?im)Faulting module name:\s*([A-Za-z0-9_.-]{1,100})') { $faultingModule = $Matches[1] }
                if ($event.Message -match '(?im)Exception code:\s*(0x[0-9a-f]{8})') { $exceptionCode = $Matches[1].ToUpperInvariant() }
                $facts = [ordered]@{ eventId = $event.Id; provider = $event.ProviderName; faultingModule = $faultingModule; exceptionCode = $exceptionCode }
                Write-Host "BOSTAN_POSTGRES_WINDOWS_EVENT $($facts | ConvertTo-Json -Compress)"
              }
            } catch {
              Write-Host "BOSTAN_POSTGRES_WINDOWS_EVENT unavailable"
            }
            throw "Embedded PostgreSQL probe failed (exit code $probeExitCode)"
          }
      - run: pnpm --filter @bostan/ui build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm --prefix desktop run package
      - name: Run packaged Windows native agent with local Qwen model
        shell: pwsh
        run: ./scripts/bostan-windows-local-native-qa.ps1
